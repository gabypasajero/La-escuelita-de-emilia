<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- App instalable (PWA): nombre, ícono, colores y pantalla completa -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FDD835" />
    <meta name="description" content="Juego educativo para niños de 3 a 6 años, con Emilia y Tito." />
    <link rel="icon" type="image/png" sizes="48x48" href="/iconos/icono-48.png" />
    <link rel="apple-touch-icon" href="/iconos/icono-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Escuelita" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: #fff8ec;
        /* Sin zoom ni selección accidental al jugar */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // Guarda el aviso de instalación para mostrar el botón "Instalar" en la zona de padres.
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__instalarApp = e;
      });
      // Modo sin internet.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para jugar.</noscript>
    <div id="root">
      <!-- Pantalla de carga: React la reemplaza al abrir el juego. -->
      <div id="cargando" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#FFE082;font-family:system-ui,sans-serif;color:#3B2F5C;text-align:center;padding:16px">
        <img src="/iconos/icono-192.png" width="120" height="120" alt="" style="border-radius:28px" />
        <div style="font-size:26px;font-weight:800">La Escuelita de Emilia</div>
        <div id="cargando-texto" style="font-size:18px">Cargando…</div>
        <button id="reintentar" style="display:none;font-size:20px;font-weight:800;padding:14px 28px;border-radius:24px;border:0;background:#43A047;color:#fff">🔄 Reintentar</button>
      </div>
    </div>
    <script>
      // Si el juego no abre en 12 segundos (por ejemplo, quedó una copia vieja guardada),
      // se ofrece "Reintentar": borra la copia guardada y vuelve a descargar el juego.
      (function () {
        function reparar() {
          var tareas = [];
          if ("serviceWorker" in navigator) tareas.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) tareas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(tareas).catch(function () {}).then(function () { location.replace("/"); });
        }
        setTimeout(function () {
          if (!document.getElementById("cargando")) return; // ya abrió
          document.getElementById("cargando-texto").textContent = "Está tardando mucho. Revisa el internet y toca Reintentar.";
          var b = document.getElementById("reintentar");
          b.style.display = "block";
          b.onclick = function () { b.textContent = "Reparando…"; reparar(); };
        }, 12000);
      })();
    </script>
  </body>
</html>
